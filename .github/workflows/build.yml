name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Streamo-Link APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platforms & build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"; exit 1
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Keystore
        run: echo "repo keystore streamo.jks is used — no generation needed"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Streamo-Link-v2.0.0-android.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamo-Link-android-apk
          path: out/Streamo-Link-v2.0.0-android.apk
          retention-days: 90
